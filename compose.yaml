services:
  app:
    build: .
    env_file: .env
    volumes:
      - keyport_data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal]
  caddy:
    image: caddy:2.11.3-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [internal]
networks:
  internal:
volumes:
  keyport_data:
  caddy_data:
  caddy_config:
