{% extends "base.html" %}{% block body %}<main class="login-shell"><div class="card auth-card border-0 shadow-lg"><div class="card-body p-4 p-md-5">
<div class="text-center mb-4"><span class="brand-mark brand-mark-lg"><i class="bi bi-key-fill"></i></span><h1 class="h3 fw-bold mt-3">Добро пожаловать</h1><p class="text-secondary">Войдите в панель управления KeyPort</p></div>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% if not configured %}<div class="alert alert-warning">Пароль администратора ещё не настроен.</div>{% endif %}
<form method="post" action="{{ admin_path }}/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="mb-3"><label class="form-label" for="username">Имя пользователя</label><input class="form-control form-control-lg" id="username" name="username" required autocomplete="username" autofocus></div><div class="mb-4"><label class="form-label" for="password">Пароль</label><input class="form-control form-control-lg" type="password" id="password" name="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-lg w-100">Войти безопасно</button></form>
</div></div></main>{% endblock %}
