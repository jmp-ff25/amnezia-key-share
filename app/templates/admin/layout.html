{% extends "base.html" %}{% block body %}
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container-xl">
<a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ admin_path }}"><span class="brand-mark"><i class="bi bi-key-fill"></i></span>KeyPort</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div id="nav" class="collapse navbar-collapse"><ul class="navbar-nav me-auto ms-lg-4"><li class="nav-item"><a class="nav-link" href="{{ admin_path }}">Обзор</a></li><li><a class="nav-link" href="{{ admin_path }}/entries">Доступы</a></li></ul>
<form method="post" action="{{ admin_path }}/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-light"><i class="bi bi-box-arrow-right me-1"></i>Выйти</button></form></div></div></nav>
<main class="container-xl py-4 py-lg-5">{% if request.query_params.get('message') %}<div class="alert alert-success alert-dismissible fade show"><i class="bi bi-check-circle me-2"></i>{{ request.query_params.get('message') }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endif %}{% block content %}{% endblock %}</main>
{% endblock %}
