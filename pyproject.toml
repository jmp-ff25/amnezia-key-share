[project]
name = "keyport"
version = "0.1.0"
description = "Private self-hosted VPN key sharing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0.52,<2.1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<0.1",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
  "mypy>=1.17,<2",
  "types-itsdangerous>=1.1.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["app.routes.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
